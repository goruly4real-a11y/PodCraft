<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <!-- Character encoding (UTF-8 supports all characters) -->
    <meta charset="UTF-8" />

    <!-- Favicons: PNG fallback first, then crisp SVG for modern browsers -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/icons/logo.svg" />

    <!--
      VIEWPORT META TAG
      This ensures the app displays correctly on mobile devices.
      - width=device-width: Width equals screen width
      - initial-scale=1.0: No zoom on page load
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      PWA META TAGS
      These tags tell the browser this is a PWA and how to display it.
    -->

    <!-- Theme color for the browser address bar (Android) -->
    <meta name="theme-color" content="#0B0F19" />

    <!--
      APPLE TOUCH ICON
      Icon shown when adding to home screen on iOS (180x180).
    -->
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />

    <!--
      APPLE MOBILE WEB APP
      Tells iOS to run in "standalone" mode (like a native app).
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <!-- Status bar style for iOS (when in standalone mode) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- App title when added to home screen on iOS -->
    <meta name="apple-mobile-web-app-title" content="PodCraft" />

    <!--
      MANIFEST LINK
      Links to the PWA manifest file.
    -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Tile color for Windows -->
    <meta name="msapplication-TileColor" content="#F59E0B" />

    <!--
      DESCRIPTION META TAG
      Shown in search results and when sharing the app.
    -->
    <meta name="description" content="Create AI-powered podcasts with custom speakers, voices, and topics." />

    <!--
      OPEN GRAPH META TAGS
      These control how the app appears when shared on social media.
    -->
    <meta property="og:title" content="PodCraft - Craft Your Podcast" />
    <meta property="og:description" content="Create AI-powered podcasts with custom speakers, voices, and topics." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icons/icon-512.png" />

    <!--
      TWITTER CARD META TAGS
      Controls how the app appears when shared on Twitter.
    -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PodCraft - Craft Your Podcast" />
    <meta name="twitter:description" content="Create AI-powered podcasts with custom speakers, voices, and topics." />
    <meta name="twitter:image" content="/icons/icon-512.png" />

    <!--
      FONT PRELOADING
      We preload fonts to make them load faster.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Page title (shown in browser tab) -->
    <title>PodCraft - Craft Your Podcast</title>
  </head>
  <body>
    <!--
      ROOT DIV
      This is where React renders the app.
    -->
    <div id="root"></div>

    <!--
      MAIN SCRIPT
      This loads the React app.
    -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
